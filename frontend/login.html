<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zeal College Admission Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #1e3a8a;
            --primary-hover: #163172;
            --accent: #2563eb;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
            --input-focus: #2563eb;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Shapes */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
            animation: float 8s ease-in-out infinite alternate;
        }

        .shape-1 {
            width: 350px;
            height: 350px;
            background: #3b82f6;
            top: -50px;
            left: -50px;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: #6366f1;
            bottom: -100px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Wrapper */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .login-header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .login-header .logo {
            font-size: 52px;
            margin-bottom: 8px;
            display: inline-block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
            animation: pulseLogo 3s infinite alternate;
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .login-header p {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 4px;
        }

        /* Card Container */
        .login-card {
            background: var(--card-bg);
            width: 100%;
            padding: 35px 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-card h2 {
            font-size: 22px;
            color: var(--text-dark);
            font-weight: 600;
            text-align: center;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        /* Pure CSS Role Selector Tabs */
        .role-selector {
            display: flex;
            position: relative;
            background: #f1f5f9;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .role-selector input[type="radio"] {
            display: none;
        }

        .role-tab {
            flex: 1;
            text-align: center;
            padding: 9px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .role-selector input#roleStudent:checked ~ label[for="roleStudent"],
        .role-selector input#roleAdmin:checked ~ label[for="roleAdmin"] {
            color: white;
        }

        .tab-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: var(--primary);
            border-radius: 25px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
        }

        .role-selector input#roleStudent:checked ~ .tab-slider {
            transform: translateX(0);
        }

        .role-selector input#roleAdmin:checked ~ .tab-slider {
            transform: translateX(100%);
        }

        /* Form Inputs */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field .icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
            color: #94a3b8;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .input-field input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid var(--input-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: white;
        }

        .input-field input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .input-field input:focus ~ .icon,
        .input-field input:focus + .icon {
            color: var(--input-focus);
        }

        /* Options Bar */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #163172 0%, #1d4ed8 100%);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .btn-arrow {
            transition: transform 0.3s ease;
        }

        .login-btn:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* Footer Link */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .signup-link {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* Responsive Styles */
        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }

            .login-header h1 {
                font-size: 20px;
            }

            .login-header p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Decorative Background Circles -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-wrapper">

        <!-- College Header / Branding -->
        <div class="login-header">
            <div class="logo">🎓</div>
            <h1>Zeal College of Engineering</h1>
            <p>Online Admission & Management Portal</p>
        </div>

        <!-- Glassmorphism Login Card -->
        <div class="login-card">

            <h2>Welcome Back</h2>
            <p class="login-subtitle">Please enter your credentials to access your portal</p>

            <div id="loginErrorMessage" style="display: none; background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;"></div>

            <form class="login-form" id="loginForm">

                <!-- Username / Email Input -->
                <div class="input-group">
                    <label for="username">Username or Email</label>
                    <div class="input-field">
                        <span class="icon">👤</span>
                        <input type="text" id="username" placeholder="Enter username or email" required autocomplete="username">
                    </div>
                </div>

                <!-- Password Input with Show/Hide Toggle -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" id="togglePasswordBtn" style="position: absolute; right: 12px; background: none; border: none; font-size: 16px; cursor: pointer; color: #64748b;" title="Toggle Password Visibility">👁</button>
                    </div>
                </div>

                <!-- Options Bar -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                    <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginSubmitBtn" class="login-btn">
                    <span id="btnText">Sign In</span>
                    <span id="btnArrow" class="btn-arrow">➔</span>
                </button>

            </form>

            <!-- Card Footer -->
            <div class="login-footer">
                <p>New Student? <a href="index.html" class="signup-link">Apply For Admission</a></p>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const rememberCheckbox = document.getElementById("remember");
            const togglePasswordBtn = document.getElementById("togglePasswordBtn");
            const forgotPasswordLink = document.getElementById("forgotPasswordLink");
            const errorBox = document.getElementById("loginErrorMessage");
            const submitBtn = document.getElementById("loginSubmitBtn");
            const btnText = document.getElementById("btnText");
            const btnArrow = document.getElementById("btnArrow");

            // Check if user is already authenticated
            fetch("/api/check-auth")
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.href = "view.html";
                    }
                })
                .catch(() => {});

            // Show/Hide Password Toggle
            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener("click", function () {
                    const isPassword = passwordInput.type === "password";
                    passwordInput.type = isPassword ? "text" : "password";
                    togglePasswordBtn.textContent = isPassword ? "🙈" : "👁";
                });
            }

            // Forgot Password Click Handler
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener("click", function (e) {
                    e.preventDefault();
                    alert("Please contact the Administrator at admin@zeal.edu.in to reset your password.");
                });
            }

            // Form Submit Handler
            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();

                    errorBox.style.display = "none";
                    errorBox.textContent = "";

                    const username = usernameInput.value.trim();
                    const password = passwordInput.value.trim();
                    const remember = rememberCheckbox.checked;

                    if (!username || !password) {
                        errorBox.textContent = "Please fill in all fields.";
                        errorBox.style.display = "block";
                        return;
                    }

                    // Button Loading State
                    submitBtn.disabled = true;
                    btnText.textContent = "Authenticating...";
                    btnArrow.textContent = "⌛";

                    fetch("/api/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password,
                            remember: remember
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => {
                                throw new Error(err.error || "Invalid credentials");
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        btnText.textContent = "Success!";
                        btnArrow.textContent = "✓";
                        setTimeout(() => {
                            window.location.href = "view.html";
                        }, 400);
                    })
                    .catch(err => {
                        errorBox.textContent = err.message || "Unable to sign in. Please try again.";
                        errorBox.style.display = "block";

                        // Reset button state
                        submitBtn.disabled = false;
                        btnText.textContent = "Sign In";
                        btnArrow.textContent = "➔";
                    });
                });
            }
        });
    </script>

</body>

</html>
