<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            🎓
        </div>

        <div class="college-name">
            <h1>Zeal College of Engineering</h1>
            <p>Online Admission Portal</p>
        </div>

    </header>

    <!-- Main Container -->

    <div class="container">

        <div class="form-header-bar">
            <h2>Student Admission Form</h2>
            <a href="view.html" class="view-records-btn">📋 View Records</a>
        </div>
        <div id="errorMessage" class="error-box" style="display: none;"></div>

<form id="admissionForm">

    <fieldset>

        <legend>Personal Information</legend>
        

        <div class="form-group">

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter Full Name" required>
            </div>

            <div class="input-box">
                <label>Father's Name</label>
                <input type="text" id="fatherName" placeholder="Enter Father's Name" required>
            </div>

        </div>

        <div class="form-group">

            <div class="input-box">
                <label>Mother's Name</label>
                <input type="text" id="motherName" placeholder="Enter Mother's Name" required>
            </div>

            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

        </div>

        <div class="form-group">

            <div class="input-box">
                <label>Gender</label>

               <select id="gender" required>
             <option value="">Select Gender</option>
             <option>Male</option>
             <option>Female</option>
             <option>Other</option>
                 </select>

            </div>

            <div class="input-box">
                <label>Blood Group</label>

               <select id="bloodGroup" required>
                  <option value="">Select Blood Group</option>
                  <option>A+</option>
                  <option>A-</option>
                  <option>B+</option>
                  <option>B-</option>
                  <option>AB+</option>
                  <option>AB-</option>
                  <option>O+</option>
                  <option>O-</option>
              </select>

            </div>

        </div>

    </fieldset>
    <fieldset>

    <legend>Contact Information</legend>

    <div class="form-group">

        <div class="input-box">
            <label>Mobile Number</label>
           <input type="tel" id="mobile" placeholder="Enter Mobile Number" required>
        </div>

        <div class="input-box">
            <label>Alternate Mobile</label>
           <input type="tel" id="altMobile" placeholder="Enter Alternate Mobile">
        </div>

    </div>

    <div class="form-group">

        <div class="input-box">
            <label>Email Address</label>
         <input type="email" id="email" placeholder="Enter Email Address" required>
        </div>

        <div class="input-box">
            <label>Aadhaar Number</label>
            <input type="text" id="aadhaar" placeholder="Enter Aadhaar Number" required>
        </div>

    </div>

    <div class="form-group">

        <div class="input-box">
            <label>Address</label>
            <textarea id="address" placeholder="Enter Full Address" required></textarea>
        </div>

    </div>

    <div class="form-group">

        <div class="input-box">
            <label>City</label>
           <input type="text" id="city" placeholder="Enter City" required>
        </div>

        <div class="input-box">
            <label>State</label>
            <input type="text" id="state" placeholder="Enter State" required>
        </div>

    </div>

    <div class="form-group">

        <div class="input-box">
            <label>Pincode</label>
          <input type="text" id="pincode" placeholder="Enter Pincode" required>
        </div>

        <div class="input-box">
            <label>Nationality</label>
            <input type="text" id="nationality" placeholder="Enter Nationality" required>
        </div>

    </div>

</fieldset>
<fieldset>

    <legend>Academic Information</legend>

    <div class="form-group">

        <div class="input-box">
            <label>10th Board</label>
       <input type="text" id="board10" placeholder="Enter Board Name" required>
        </div>

        <div class="input-box">
            <label>10th Percentage</label>

                 <input
                       type="number"
                       id="percentage10"
                       placeholder="Enter 10th Percentage"
                       min="0"
                       max="100"
                       required>
              </div>

         </div>

    <div class="form-group">

        <div class="input-box">
            <label>12th Board</label>
            <input type="text" id="board12" placeholder="Enter 12th Board" required>
        </div>

        <div class="input-box">
            <label>12th Percentage</label>
           <input type="number" id="percentage12" placeholder="Enter 12th Percentage" min="0" max="100" required>
        </div>

    </div>

    <div class="form-group">

        <div class="input-box">
            <label>Entrance Exam</label>

            <select id="entranceExam" required>
                    <option value="">Select Entrance Exam</option>
                    <option>MHT-CET</option>
                    <option>JEE</option>
                    <option>NEET</option>
                    <option>Other</option>
            </select>
        </div>

        <div class="input-box">
            <label>Entrance Score</label>
           <input type="number" id="entranceScore" placeholder="Enter Entrance Score" required>
        </div>

    </div>

</fieldset>
<fieldset>

    <legend>Course Selection</legend>

    <div class="form-group">

        <div class="input-box">

            <label>Select Department</label>

           <select id="department" required>
                    <option value="">Select Department</option>
                    <option>Computer Engineering</option>
                    <option>Information Technology</option>
                    <option>Artificial Intelligence & Data Science</option>
                    <option>Electronics & Telecommunication</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
           </select>

        </div>

        <div class="input-box">

            <label>Admission Type</label>

            <select id="admissionType" required>
                     <option value="">Select Admission Type</option>
                     <option>CAP</option>
                     <option>Management</option>
                     <option>NRI</option>
            </select>

        </div>

    </div>

</fieldset>
<fieldset>

    <legend>Document Upload</legend>

    <div class="form-group">

        <div class="input-box">
            <label>Passport Photo</label>
           <input type="file" id="photo" accept="image/*">
        </div>

        <div class="input-box">
            <label>10th Marksheet</label>
            <input type="file" id="marksheet10">
        </div>

    </div>

    <div class="form-group">

        <div class="input-box">
            <label>12th Marksheet</label>
            <input type="file" id="marksheet12">
        </div>

        <div class="input-box">
            <label>Leaving Certificate</label>
            <input type="file" id="leavingCertificate">
        </div>

    </div>

</fieldset>
<fieldset>

    <legend>Declaration</legend>

    <label>

       <input type="checkbox" id="declaration" required>

        I hereby declare that the information provided above is true and correct.

    </label>

    <br><br>

    <div class="button-group">

        <button type="submit" class="submit-btn">
            <span>🚀</span> Submit Application
        </button>

        <button type="reset" class="reset-btn">
            <span>🔄</span> Reset Form
        </button>

    </div>

</fieldset>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
